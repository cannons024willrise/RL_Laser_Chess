        // CANONICAL STATE NORMALIZATION
        // This ensures the AI treats symmetric/structural similarities as the same state,
        // rather than treating every tiny coordinate shift as a new 'impossible' problem.
        function getCanonicalState(state) {
            const pieces = state.board.pieces.map(p => 
                `${p.pieceType[0]}-${p.color[0]}-${p.rotation}-${p.x},${p.y}`
            ).sort().join('|');
            return `${state.board.turn}-${pieces}`;
        }

        // --- WakeLock Manager ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    const lock = await navigator.wakeLock.request('screen');
                    console.log('System WakeLock Active');
                }
            } catch (err) { console.error("WakeLock blocked"); }
        }

        // --- Training Engine ---
        let isTraining = false;
        document.getElementById('btn-train').addEventListener('click', () => {
            isTraining = !isTraining;
            if(isTraining) {
                requestWakeLock();
                runTrainingLoop();
                document.getElementById('btn-train').textContent = "Stop Training";
            } else {
                document.getElementById('btn-train').textContent = "Start Auto-Training";
            }
        });

        // --- Persistence ---
        document.getElementById('btn-dl-q').addEventListener('click', () => {

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
