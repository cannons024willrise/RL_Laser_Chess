<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LASER CHESS - PORTED CORE</title>
    <style>
        @font-face { font-family: 'Unifont'; src: url('unifont-15.0.01.ttf') format('truetype'); }
        :root { 
            --bg0: #0a0a0a; --bg1: #1a1a1a; --line: #2a2a2a;
            --text: #b0b0b0; --bright: #ffffff; --error: #ff5555; 
            --blue: #00d4ff; --red: #ff3333; --laser: #ffff00;
        }
        body { margin: 0; padding: 30px; font-size: 22px; color: var(--text); font-family: 'Unifont', monospace; background: var(--bg0); }
        #terminal-log { display: flex; flex-direction: column; gap: 4px; }
        .matrix-container { display: inline-block; padding: 20px; border: 1px solid var(--line); background: var(--bg1); }
        .matrix-row { display: flex; }
        .matrix-cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
        .p-red { color: var(--red); }
        .p-blue { color: var(--blue); }
        .cursor { outline: 2px solid var(--bright); }
        .selected-piece { background: var(--line); }
        .error-msg { color: var(--error); }
    </style>
</head>
<body>
    <div id="terminal-log"></div>
    <script>
    (() => {
        'use strict';
        const logContainer = document.getElementById('terminal-log');
        let cursorX = 0, cursorY = 0, selectedOrigin = null, isAnimating = false;
        
        let latestState = { board: { turn: "BLUE", pieces: [
            {id: "k1", pieceType: "KING", color: "BLUE", rotation: 0, x: 4, y: 0}, 
            {id: "k2", pieceType: "KING", color: "RED", rotation: 0, x: 5, y: 7},
            {id: "l1", pieceType: "LASER", color: "RED", rotation: 2, x: 0, y: 7},
            {id: "l2", pieceType: "LASER", color: "BLUE", rotation: 0, x: 9, y: 0},
            {id: "d1", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 2, y: 0},
            {id: "d2", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 0, y: 3}
        ]}};

        const DIRS = [ { dx: 0, dy: 1 }, { dx: 1, dy: 0 }, { dx: 0, dy: -1 }, { dx: -1, dy: 0 } ]; 
        const ROTATION_TABLE = { 
            KING: { 0: '◈', 1: '◈', 2: '◈', 3: '◈' }, 
            LASER: { 0: '⫝', 1: '⟜', 2: 'Ͳ', 3: 'Ð' }, 
            DEFLECTOR: { 0: '◤', 1: '◥', 2: '◢', 3: '◣' } 
        };

        const INTERACTION_MAP = {
            DEFLECTOR: {
                0: { 0: { action: 'reflect', nextDir: 1 }, 3: { action: 'reflect', nextDir: 2 }, 1: { action: 'destroy' }, 2: { action: 'destroy' } },
                1: { 0: { action: 'reflect', nextDir: 3 }, 1: { action: 'reflect', nextDir: 2 }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
                2: { 2: { action: 'reflect', nextDir: 3 }, 1: { action: 'reflect', nextDir: 0 }, 0: { action: 'destroy' }, 3: { action: 'destroy' } },
                3: { 2: { action: 'reflect', nextDir: 1 }, 3: { action: 'reflect', nextDir: 0 }, 0: { action: 'destroy' }, 1: { action: 'destroy' } }
            },
            LASER: {
                0: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } },
                1: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } },
                2: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } },
                3: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } }
            }
        };

        function normalizeRotation(rot) { return ((Number(rot) || 0) % 4 + 4) % 4; }
        function getPieceAt(pieces, x, y) { return pieces.find(p => p && p.x === x && p.y === y) || null; }
        function interactWithLaser(piece, incomingDir) {
            const typeMap = INTERACTION_MAP[piece.pieceType];
            if (!typeMap) return { kind: 'stop', destroyed: false };
            const outcome = typeMap[normalizeRotation(piece.rotation)]?.[incomingDir];
            if (!outcome) return { kind: 'stop', destroyed: false };
            if (outcome.action === 'reflect') return { kind: 'reflect', destroyed: false, reflected: outcome.nextDir };
            if (outcome.action === 'block') return { kind: 'stop', blocked: true, destroyed: false };
            if (outcome.action === 'destroy') return { kind: 'stop', destroyed: true };
            return { kind: 'stop', destroyed: false };
        }

        function resolveLaserVector(x, y, dir, pieces, path = [], seen = new Set()) {
            if (x < 0 || x > 9 || y < 0 || y > 7) return { path, hit: null };
            const stateKey = `${x},${y},${dir}`;
            if (seen.has(stateKey)) return { path, hit: null };
            seen.add(stateKey);
            path.push({ x, y, dir });
            const piece = getPieceAt(pieces, x, y);
            if (!piece) return resolveLaserVector(x + DIRS[dir].dx, y + DIRS[dir].dy, dir, pieces, path, seen);
            const outcome = interactWithLaser(piece, dir);
            if (outcome.kind === 'reflect') return resolveLaserVector(x + DIRS[outcome.reflected].dx, y + DIRS[outcome.reflected].dy, outcome.reflected, pieces, path, seen);
            return { path, hit: { piece, destroyed: !!outcome.destroyed } };
        }

        async function processGameAction(intent) {
            const pieces = latestState.board.pieces;
            const activePlayer = latestState.board.turn;

            // VALDIATION SYSTEM (Ported)
            if (intent.action === 'Move') {
                const dbPiece = getPieceAt(pieces, intent.piece.x, intent.piece.y);
                if (!dbPiece || dbPiece.color !== activePlayer) return;
                const nx = intent.changes.new.x; const ny = intent.changes.new.y;
                if (Math.abs(nx - dbPiece.x) > 1 || Math.abs(ny - dbPiece.y) > 1) return;
                dbPiece.x = nx; dbPiece.y = ny;
            } else if (intent.action === 'Rotate') {
                const dbPiece = getPieceAt(pieces, intent.piece.x, intent.piece.y);
                dbPiece.rotation = intent.changes.new.rotation;
            }

            // LASER ENGINE (Ported)
            if (intent.action !== 'Turn End') {
                const shooter = pieces.find(p => p.pieceType === 'LASER' && p.color === activePlayer);
                const startDir = normalizeRotation(shooter.rotation);
                const trace = resolveLaserVector(shooter.x + DIRS[startDir].dx, shooter.y + DIRS[startDir].dy, startDir, pieces);
                if (trace.hit && trace.hit.destroyed) {
                    latestState.board.pieces = pieces.filter(p => !(p.x === trace.hit.piece.x && p.y === trace.hit.piece.y));
                }
            }
            
            latestState.board.turn = activePlayer === 'RED' ? 'BLUE' : 'RED';
            selectedOrigin = null;
            printMatrix();
        }

        function printMatrix() {
            logContainer.innerHTML = '';
            const container = document.createElement('div'); container.className = 'matrix-container';
            for (let y = 7; y >= 0; y--) {
                const row = document.createElement('div'); row.className = 'matrix-row';
                for (let x = 0; x < 10; x++) {
                    const cell = document.createElement('div'); cell.className = 'matrix-cell';
                    if (x === cursorX && y === cursorY) cell.classList.add('cursor');
                    if (selectedOrigin && selectedOrigin.x === x && selectedOrigin.y === y) cell.classList.add('selected-piece');
                    const p = getPieceAt(latestState.board.pieces, x, y);
                    if (p) { cell.textContent = ROTATION_TABLE[p.pieceType][p.rotation]; cell.classList.add(p.color === 'RED' ? 'p-red' : 'p-blue'); }
                    cell.onclick = () => { cursorX = x; cursorY = y; handleInput('Enter'); };
                    row.appendChild(cell);
                }
                container.appendChild(row);
            }
            logContainer.appendChild(container);
        }

        function handleInput(key) {
            if (key === 'ArrowUp' && cursorY < 7) cursorY++;
            else if (key === 'ArrowDown' && cursorY > 0) cursorY--;
            else if (key === 'ArrowLeft' && cursorX > 0) cursorX--;
            else if (key === 'ArrowRight' && cursorX < 9) cursorX++;
            else if (key === 'Enter') {
                if (!selectedOrigin) selectedOrigin = {x: cursorX, y: cursorY};
                else if (selectedOrigin.x === cursorX && selectedOrigin.y === cursorY) selectedOrigin = null;
                else processGameAction({action: 'Move', piece: selectedOrigin, changes: {new: {x: cursorX, y: cursorY}}});
            } else if (key === 'f') {
                processGameAction({action: 'Turn End'});
            } else if (key === 'r' && selectedOrigin) {
                const p = getPieceAt(latestState.board.pieces, selectedOrigin.x, selectedOrigin.y);
                processGameAction({action: 'Rotate', piece: selectedOrigin, changes: {new: {rotation: (p.rotation + 1) % 4}}});
            }
            printMatrix();
        }

        window.addEventListener('keydown', (e) => handleInput(e.key));
        printMatrix();
    })();
    </script>
</body>
</html>
