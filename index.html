<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        @font-face { font-family: 'Unifont'; src: url('unifont-15.0.01.ttf') format('truetype'); }
        :root { 
            --bg0: #0a0a0a; --bg1: #1a1a1a; --line: #2a2a2a; --text: #b0b0b0; 
            --bright: #ffffff; --error: #ff5555; --muted: #999999; --blue: #00d4ff; --red: #ff3333;
        }
        body { margin: 0; padding: 30px; font-family: 'Unifont', monospace; background: var(--bg0); color: var(--text); }
        #ai-dashboard { border: 1px solid var(--line); padding: 15px; margin-bottom: 20px; background: var(--bg1); }
        .matrix-container { background: var(--bg1); padding: 20px; border: 1px solid var(--line); margin-top: 10px; }
        .matrix-row { display: flex; }
        .matrix-cell { width: 40px; height: 40px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .p-red { color: var(--red); } .p-blue { color: var(--blue); }
        .cursor { outline: 2px solid var(--bright); }
        .history-line { white-space: pre-wrap; font-size: 14px; }
    </style>
</head>
