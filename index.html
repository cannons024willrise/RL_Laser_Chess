<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>LASER CHESS - RL Engine Integrated</title>
    <style>
        :root { --bg: #0a0a0a; --line: #333; --blue: #00d4ff; --red: #ff3333; --text: #ccc; }
        body { background: var(--bg); color: var(--text); font-family: monospace; padding: 20px; }
        #dashboard { border: 1px solid var(--line); padding: 15px; background: #111; margin-bottom: 20px; }
        .board { display: inline-block; border: 1px solid var(--line); padding: 10px; background: #000; }
        .row { display: flex; }
        .cell { width: 40px; height: 40px; border: 1px solid #222; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .p-red { color: var(--red); } .p-blue { color: var(--blue); }
        .log-box { height: 200px; overflow-y: scroll; border: 1px solid #333; padding: 10px; margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="dashboard">
        <h3>🧠 RL Observation Deck</h3>
        <button onclick="toggleTraining()">Toggle AI Training</button>
        <button onclick="isHumanVsAI = !isHumanVsAI; updateUI()">Toggle Mode (Twin vs Human)</button>
        <div>
            Status: <span id="status">IDLE</span> | 
            Reward Mode: <span id="reward-mode">Twin Play (±1000)</span> |
            Q-Table Size: <span id="q-size">0</span>
        </div>
        <div id="training-log" class="log-box"></div>
    </div>

    <div id="board-container" class="board"></div>

    <script>
        // --- Game State & RL Variables ---
        let Q_TABLE = { 'RED': {}, 'BLUE': {} };
        let isTraining = false;
        let isHumanVsAI = false;
        let latestState = { board: { turn: "BLUE", pieces: [] } };

        // --- Core Game Initialization ---
        function initGame() {
            latestState.board.pieces = [
                {id: 1, pieceType: "KING", color: "BLUE", rotation: 0, x: 4, y: 0},
                {id: 2, pieceType: "KING", color: "RED", rotation: 0, x: 5, y: 7},
                {id: 3, pieceType: "LASER", color: "RED", rotation: 2, x: 0, y: 7},
                {id: 4, pieceType: "LASER", color: "BLUE", rotation: 0, x: 9, y: 0}
            ];
            renderBoard();
        }

        // --- Rendering Logic ---
        function renderBoard() {
            const container = document.getElementById('board-container');
            container.innerHTML = '';
            for (let y = 7; y >= 0; y--) {
                const row = document.createElement('div'); row.className = 'row';
                for (let x = 0; x < 10; x++) {
                    const cell = document.createElement('div'); cell.className = 'cell';
                    const piece = latestState.board.pieces.find(p => p.x === x && p.y === y);
                    if (piece) {
                        cell.textContent = piece.pieceType[0];
                        cell.classList.add(piece.color === 'RED' ? 'p-red' : 'p-blue');
                    } else { cell.textContent = '.'; }
                    row.appendChild(cell);
                }
                container.appendChild(row);
            }
        }

        // --- RL Logic ---
        function getCanonicalState(state) {
            return state.board.pieces.map(p => `${p.pieceType}-${p.color}-${p.x},${p.y}`).sort().join('|');
        }

        function toggleTraining() {
            isTraining = !isTraining;
            document.getElementById('status').textContent = isTraining ? "TRAINING" : "IDLE";
            if (isTraining) runTrainingLoop();
        }

        async function runTrainingLoop() {
            while (isTraining) {
                const stateKey = getCanonicalState(latestState);
                const action = "MOVE_PIECE"; // Logic to pick move goes here
                const reward = 0; // Logic for outcome goes here

                // Update Q-Table
                if (!Q_TABLE[latestState.board.turn][stateKey]) Q_TABLE[latestState.board.turn][stateKey] = {};
                
                // Update UI
                document.getElementById('q-size').textContent = Object.keys(Q_TABLE.RED).length + Object.keys(Q_TABLE.BLUE).length;
                logEvent(`State: ${stateKey.slice(0, 20)}... | Action: ${action} | Reward: ${reward}`);
                
                await new Promise(r => setTimeout(r, 500));
            }
        }

        function logEvent(msg) {
            const log = document.getElementById('training-log');
            log.innerHTML = `<div>${new Date().toLocaleTimeString()} ${msg}</div>` + log.innerHTML;
        }

        function updateUI() {
            document.getElementById('reward-mode').textContent = isHumanVsAI ? "Human vs Model (±10,000)" : "Twin Play (±1,000)";
        }

        initGame();
    </script>
</body>
</html>
