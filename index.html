<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LASER CHESS - Local Engine</title>
    <style>
        @font-face { font-family: 'Unifont'; src: url('unifont-15.0.01.ttf') format('truetype'); }
        :root { 
            --bg0: #0a0a0a; --bg1: #1a1a1a; --line: #2a2a2a;
            --text: #b0b0b0; --bright: #ffffff; --error: #ff5555; 
            --muted: #999999; --waiting: #00ff00; --blue: #00d4ff; --red: #ff3333;
            --blue-tint: rgba(0, 212, 255, 0.15); --red-tint: rgba(255, 51, 51, 0.15);
            --laser: #ffff00;
        }
        body { margin: 0; padding: 30px; font-size: 22px; color: var(--text); font-family: 'Unifont', monospace; background: radial-gradient(circle at center, var(--bg1), var(--bg0)); }
        #terminal-log { display: flex; flex-direction: column; gap: 4px; }
        .history-line { white-space: pre-wrap; }
        .matrix-container { display: inline-block; padding: 20px; border: 1px solid var(--line); background: var(--bg1); margin-top: 10px; }
        .matrix-row { display: flex; }
        .matrix-cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); cursor: pointer; }
        .reserved-blue { background: var(--blue-tint); }
        .reserved-red { background: var(--red-tint); }
        .p-red { color: var(--red); }
        .p-blue { color: var(--blue); }
        .cursor { outline: 2px solid var(--bright); z-index: 1; }
        .selected-piece { background: var(--line); }
        .error-msg { color: var(--error); }
        .success-msg { color: var(--waiting); }
        .system-msg { color: var(--muted); }
        .highlight { color: var(--bright); }
    </style>
</head>
<body>
    <div id="terminal-log"></div>

    <script>
    (() => {
      'use strict';
      const logContainer = document.getElementById('terminal-log');
      let cursorX = 0, cursorY = 0, latestState = null, activeMatrixContainer = null, selectedOrigin = null;
      let isAnimatingLocalTurn = false;

      const DIRS = [ { dx: 0, dy: 1 }, { dx: 1, dy: 0 }, { dx: 0, dy: -1 }, { dx: -1, dy: 0 } ]; 
      const ROTATION_TABLE = { 
        KING: { 0: '◈', 1: '◈', 2: '◈', 3: '◈' }, 
        LASER: { 0: '⫝', 1: '⟜', 2: 'Ͳ', 3: 'Ð' }, 
        SWITCH: { 0: '⟋', 1: '⟍', 2: '⟋', 3: '⟍' }, 
        DEFENDER: { 0: '⬓', 1: '◧', 2: '⬒', 3: '◨' }, 
        DEFLECTOR: { 0: '◤', 1: '◥', 2: '◢', 3: '◣' } 
      };
      const BLUE_RESERVED = [{x: 9, y: 0}, {x: 9, y: 1}, {x: 9, y: 2}, {x: 9, y: 3}, {x: 9, y: 4}, {x: 9, y: 5}, {x: 9, y: 6}, {x: 9, y: 7}, {x: 1, y: 0}, {x: 1, y: 7}];
      const RED_RESERVED = [{x: 0, y: 0}, {x: 0, y: 1}, {x: 0, y: 2}, {x: 0, y: 3}, {x: 0, y: 4}, {x: 0, y: 5}, {x: 0, y: 6}, {x: 0, y: 7}, {x: 8, y: 0}, {x: 8, y: 7}];

      const INTERACTION_MAP = {
          DEFLECTOR: {
              0: { 0: { action: 'reflect', nextDir: 1 }, 3: { action: 'reflect', nextDir: 2 }, 1: { action: 'destroy' }, 2: { action: 'destroy' } },
              1: { 0: { action: 'reflect', nextDir: 3 }, 1: { action: 'reflect', nextDir: 2 }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              2: { 2: { action: 'reflect', nextDir: 3 }, 1: { action: 'reflect', nextDir: 0 }, 0: { action: 'destroy' }, 3: { action: 'destroy' } },
              3: { 2: { action: 'reflect', nextDir: 1 }, 3: { action: 'reflect', nextDir: 0 }, 0: { action: 'destroy' }, 1: { action: 'destroy' } }
          },
          SWITCH: {
              0: { 0: { action: 'reflect', nextDir: 1 }, 1: { action: 'reflect', nextDir: 0 }, 2: { action: 'reflect', nextDir: 3 }, 3: { action: 'reflect', nextDir: 2 } },
              1: { 0: { action: 'reflect', nextDir: 3 }, 3: { action: 'reflect', nextDir: 0 }, 2: { action: 'reflect', nextDir: 1 }, 1: { action: 'reflect', nextDir: 2 } },
              2: { 0: { action: 'reflect', nextDir: 1 }, 1: { action: 'reflect', nextDir: 0 }, 2: { action: 'reflect', nextDir: 3 }, 3: { action: 'reflect', nextDir: 2 } },
              3: { 0: { action: 'reflect', nextDir: 3 }, 3: { action: 'reflect', nextDir: 0 }, 2: { action: 'reflect', nextDir: 1 }, 1: { action: 'reflect', nextDir: 2 } }
          },
          DEFENDER: {
              0: { 0: { action: 'block' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              1: { 1: { action: 'block' }, 0: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              2: { 2: { action: 'block' }, 0: { action: 'destroy' }, 1: { action: 'destroy' }, 3: { action: 'destroy' } },
              3: { 3: { action: 'block' }, 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' } }
          },
          KING: {
              0: { 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              1: { 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              2: { 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              3: { 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } }
          },
          LASER: {
              0: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } },
              1: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } },
              2: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } },
              3: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } }
          }
      };

      const sleep = ms => new Promise(r => setTimeout(r, ms));
      function add(text, cls='') { const d = document.createElement('div'); d.className = `history-line ${cls}`; d.textContent = text; logContainer.appendChild(d); window.scrollTo(0, document.body.scrollHeight); }
      function getPieceChar(piece) { return ROTATION_TABLE[piece.pieceType] ? ROTATION_TABLE[piece.pieceType][piece.rotation || 0] : '?'; }
      function getBoardPieces(state) { return state.board.pieces; }
      function getReservedClass(x, y) { return BLUE_RESERVED.some(s => s.x === x && s.y === y) ? 'reserved-blue' : RED_RESERVED.some(s => s.x === x && s.y === y) ? 'reserved-red' : null; }
      function inBounds(x, y) { return x >= 0 && x <= 9 && y >= 0 && y <= 7; }
      function normalizeRotation(rot) { return ((Number(rot) || 0) % 4 + 4) % 4; }
      function getPieceAt(pieces, x, y) { return pieces.find(p => p && p.x === x && p.y === y) || null; }
      
      function interactWithLaser(piece, incomingDir) {
          const typeMap = INTERACTION_MAP[piece.pieceType];
          if (!typeMap) return { kind: 'stop', destroyed: false };
          const outcome = typeMap[normalizeRotation(piece.rotation)]?.[incomingDir];
          if (!outcome) return { kind: 'stop', destroyed: false };
          if (outcome.action === 'reflect') return { kind: 'reflect', destroyed: false, reflected: outcome.nextDir };
          if (outcome.action === 'block') return { kind: 'stop', blocked: true, destroyed: false };
          if (outcome.action === 'destroy') return { kind: 'stop', destroyed: true };
          return { kind: 'stop', destroyed: false };
      }

      function resolveLaserVector(x, y, dir, pieces, path = [], seen = new Set()) {
          if (!inBounds(x, y)) return { path, hit: null, looped: false };
          const stateKey = `${x},${y},${dir}`;
          if (seen.has(stateKey)) return { path, hit: null, looped: true };
          seen.add(stateKey);
          path.push({ x, y, dir });
          const piece = getPieceAt(pieces, x, y);
          if (!piece) return resolveLaserVector(x + DIRS[dir].dx, y + DIRS[dir].dy, dir, pieces, path, seen);
          const outcome = interactWithLaser(piece, dir);
          if (outcome.kind === 'reflect') return resolveLaserVector(x + DIRS[outcome.reflected].dx, y + DIRS[outcome.reflected].dy, outcome.reflected, pieces, path, seen);
          return { path, hit: { piece, blocked: !!outcome.blocked, destroyed: !!outcome.destroyed }, looped: false };
      }

      async function playLaserAnimation(state, pieces, shooterColor) {
          isAnimatingLocalTurn = true;
          const shooter = pieces.find(p => p && p.pieceType === 'LASER' && p.color === shooterColor);
          if (shooter) {
              const startDir = normalizeRotation(shooter.rotation);
              const trace = resolveLaserVector(shooter.x + DIRS[startDir].dx, shooter.y + DIRS[startDir].dy, startDir, pieces);
              printTerminalMatrix(state, trace.path);
              await sleep(1500);
          }
          isAnimatingLocalTurn = false;
      }

      function printTerminalMatrix(state, laserPath = []) {
        latestState = state;
        const pieces = getBoardPieces(state);
        const grid = Array.from({ length: 8 }, () => Array(10).fill(null));
        for (const piece of pieces) { if (piece && Number.isFinite(piece.x)) grid[piece.y][piece.x] = piece; }
        
        const container = document.createElement('div'); container.className = 'matrix-container';
        const currentTurn = state.board.turn;

        const header = document.createElement('div');
        header.style.marginBottom = '10px';
        header.innerHTML = `[TURN: <span class="${currentTurn === 'RED' ? 'p-red' : 'p-blue'}">${currentTurn}</span>] | Arrows: Move | Enter: Select | R/L: Rotate | F: Fire`;
        container.appendChild(header);

        for (let y = 7; y >= 0; y--) {
          let rowEl = document.createElement('div'); rowEl.className = 'matrix-row';
          for (let x = 0; x < 10; x++) {
            let cellEl = document.createElement('span'); cellEl.className = 'matrix-cell';
            const resClass = getReservedClass(x, y);
            if (resClass) cellEl.classList.add(resClass);
            if (x === cursorX && y === cursorY) cellEl.classList.add('cursor');
            if (selectedOrigin && x === selectedOrigin.x && y === selectedOrigin.y) cellEl.classList.add('selected-piece');
            const p = grid[y][x]; 
            if (p) { cellEl.textContent = getPieceChar(p); cellEl.classList.add(p.color === 'RED' ? 'p-red' : 'p-blue'); } 
            else {
              const pathSegment = laserPath.find(seg => seg.x === x && seg.y === y);
              if (pathSegment) { cellEl.textContent = ['^', '>', 'v', '<'][pathSegment.dir]; cellEl.style.color = 'var(--laser)'; }
              else { cellEl.textContent = '·'; }
            }
            cellEl.onclick = () => { cursorX = x; cursorY = y; handleGridAction(); };
            rowEl.appendChild(cellEl);
          }
          container.appendChild(rowEl);
        }
        if (activeMatrixContainer && activeMatrixContainer.parentNode) activeMatrixContainer.parentNode.replaceChild(container, activeMatrixContainer);
        else logContainer.appendChild(container);
        activeMatrixContainer = container;
      }

      async function processGameAction(intent) {
        if (!latestState) return;
        const pieces = getBoardPieces(latestState);
        const activePlayer = latestState.board.turn;
        
        if (intent.action === 'Move') {
            const dbPiece = getPieceAt(pieces, intent.piece.x, intent.piece.y);
            const nx = intent.changes.new.x; const ny = intent.changes.new.y; 
            const pieceAtTarget = getPieceAt(pieces, nx, ny);
            if (pieceAtTarget && dbPiece.pieceType === 'SWITCH') { pieceAtTarget.x = dbPiece.x; pieceAtTarget.y = dbPiece.y; }
            dbPiece.x = nx; dbPiece.y = ny;
        } else if (intent.action === 'Rotate') {
            const dbPiece = getPieceAt(pieces, intent.piece.x, intent.piece.y);
            dbPiece.rotation = intent.changes.new.rotation;
        }

        if (intent.action !== 'Turn End') {
            const shooter = pieces.find(p => p && p.pieceType === 'LASER' && p.color === activePlayer);
            if (shooter) {
                const startDir = normalizeRotation(shooter.rotation);
                const trace = resolveLaserVector(shooter.x + DIRS[startDir].dx, shooter.y + DIRS[startDir].dy, startDir, pieces);
                await playLaserAnimation(latestState, pieces, activePlayer);
                if (trace.hit && trace.hit.destroyed) {
                    latestState.board.pieces = pieces.filter(p => !(p.x === trace.hit.piece.x && p.y === trace.hit.piece.y));
                    add(`Laser hit ${trace.hit.piece.color} ${trace.hit.piece.pieceType}!`, 'error-msg');
                    if (trace.hit.piece.pieceType === 'KING') { add(`${activePlayer} WINS!`, 'success-msg'); return; }
                }
            }
        }
        latestState.board.turn = activePlayer === 'RED' ? 'BLUE' : 'RED';
        selectedOrigin = null;
        printTerminalMatrix(latestState);
      }

      function handleGridAction() {
        if (isAnimatingLocalTurn) return;
        if (!selectedOrigin) {
            const p = getPieceAt(getBoardPieces(latestState), cursorX, cursorY);
            if (p && p.color === latestState.board.turn) { selectedOrigin = { x: cursorX, y: cursorY }; printTerminalMatrix(latestState); }
        } else {
            if (selectedOrigin.x === cursorX && selectedOrigin.y === cursorY) { selectedOrigin = null; printTerminalMatrix(latestState); }
            else { processGameAction({ action: 'Move', piece: { x: selectedOrigin.x, y: selectedOrigin.y }, changes: { new: { x: cursorX, y: cursorY } } }); }
        }
      }

      window.addEventListener('keydown', (e) => {
        if (isAnimatingLocalTurn) return;
        if (e.key === 'ArrowUp' && cursorY < 7) cursorY++; else if (e.key === 'ArrowDown' && cursorY > 0) cursorY--;
        else if (e.key === 'ArrowLeft' && cursorX > 0) cursorX--; else if (e.key === 'ArrowRight' && cursorX < 9) cursorX++;
        else if (e.key === 'Enter') handleGridAction();
        else if (e.key.toLowerCase() === 'f') processGameAction({ action: 'Turn End' });
        else if (['r', 'l'].includes(e.key.toLowerCase()) && selectedOrigin) {
            const p = getPieceAt(getBoardPieces(latestState), selectedOrigin.x, selectedOrigin.y);
            processGameAction({ action: 'Rotate', piece: { x: selectedOrigin.x, y: selectedOrigin.y }, changes: { new: { rotation: ((p.rotation || 0) + (e.key.toLowerCase() === 'r' ? 1 : -1) + 4) % 4 } } });
        }
        printTerminalMatrix(latestState);
      });

      // Initial State
      latestState = { board: { turn: "BLUE", pieces: [
        {id: "pmpfnkxpm1", pieceType: "KING", color: "BLUE", rotation: 0, x: 4, y: 0}, {id: "pmpfnl4j03", pieceType: "KING", color: "RED", rotation: 0, x: 5, y: 7},
        {id: "pmpfqugdq4", pieceType: "DEFENDER", color: "RED", rotation: 0, x: 4, y: 7}, {id: "pmpfquhvx5", pieceType: "DEFENDER", color: "RED", rotation: 0, x: 6, y: 7},
        {id: "pmpfqunnp6", pieceType: "DEFENDER", color: "BLUE", rotation: 2, x: 5, y: 0}, {id: "pmpfquoqi7", pieceType: "DEFENDER", color: "BLUE", rotation: 2, x: 3, y: 0},
        {id: "pmpfqvc388", pieceType: "SWITCH", color: "BLUE", rotation: 0, x: 5, y: 3}, {id: "pmpfqvfrb9", pieceType: "SWITCH", color: "BLUE", rotation: 1, x: 4, y: 3},
        {id: "pmpfqvl06a", pieceType: "SWITCH", color: "RED", rotation: 0, x: 4, y: 4}, {id: "pmpfqvre4b", pieceType: "SWITCH", color: "RED", rotation: 1, x: 5, y: 4},
        {id: "pmpfqwdqec", pieceType: "LASER", color: "RED", rotation: 2, x: 0, y: 7}, {id: "pmpfqy5dve", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 2, y: 0},
        {id: "pmpfqya0pf", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 2, y: 3}, {id: "pmpfqyd1rg", pieceType: "DEFLECTOR", color: "BLUE", rotation: 1, x: 2, y: 4},
        {id: "pmpfqz0jlj", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 0, y: 3}, {id: "pmpfqz7fpk", pieceType: "DEFLECTOR", color: "RED", rotation: 3, x: 0, y: 4},
        {id: "pmpfqzj2ul", pieceType: "DEFLECTOR", color: "BLUE", rotation: 3, x: 7, y: 1}, {id: "pmpfr0e5km", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 6, y: 2},
        {id: "pmpfr0t7zn", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 7, y: 4}, {id: "pmpfr0ww1o", pieceType: "DEFLECTOR", color: "RED", rotation: 3, x: 7, y: 3},
        {id: "pmpfr18esp", pieceType: "DEFLECTOR", color: "BLUE", rotation: 1, x: 9, y: 3}, {id: "pmpfr1bjtq", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 9, y: 4},
        {id: "pmpfr2ek5s", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 3, y: 5}, {id: "pmpfr2sl8u", pieceType: "DEFLECTOR", color: "RED", rotation: 1, x: 2, y: 6},
        {id: "pmpfr337lv", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 7, y: 7}, {id: "pmpfr69imw", pieceType: "LASER", color: "BLUE", rotation: 0, x: 9, y: 0}
      ]}};
      printTerminalMatrix(latestState);
    })();
    </script>
</body>
</html>
