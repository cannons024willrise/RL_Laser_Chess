<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LASER CHESS - Local Pass & Play Edition</title>
    <style>
        @font-face { font-family: 'Unifont'; src: url('unifont-15.0.01.ttf') format('truetype'); }
        :root { 
            --bg0: #0a0a0a; --bg1: #1a1a1a; --line: #2a2a2a;
            --text: #b0b0b0; --bright: #ffffff; --error: #ff5555; 
            --muted: #999999; --waiting: #00ff00; --blue: #00d4ff; --red: #ff3333;
            --blue-tint: rgba(0, 212, 255, 0.15); --red-tint: rgba(255, 51, 51, 0.15);
            --laser: #ffff00;
        }
        body { margin: 0; padding: 30px; font-size: 22px; color: var(--text); font-family: 'Unifont', monospace; background: radial-gradient(circle at center, var(--bg1), var(--bg0)); }
        body.basic-font, body.basic-font .user-input-line { font-family: 'Courier New', monospace; }
        #terminal-log { display: flex; flex-direction: column; gap: 4px; }
        .history-line { white-space: pre-wrap; }
        .prompt { color: var(--bright); }
        .user-input-line { background: transparent; border: none; color: var(--bright); font-family: 'Unifont', monospace; font-size: 22px; width: 100%; outline: none; }
        .matrix-container { display: inline-block; padding: 20px; border: 1px solid var(--line); background: var(--bg1); margin-top: 10px; }
        .matrix-row { display: flex; }
        .matrix-cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); cursor: pointer; }
        .reserved-blue { background: var(--blue-tint); }
        .reserved-red { background: var(--red-tint); }
        .p-red { color: var(--red); }
        .p-blue { color: var(--blue); }
        .cursor { outline: 2px solid var(--bright); z-index: 1; }
        .selected-piece { background: var(--line); }
        .error-msg { color: var(--error); }
        .success-msg { color: var(--waiting); }
        .system-msg { color: var(--muted); }
        .highlight { color: var(--bright); }
        a { color: var(--blue); text-decoration: none; }
    </style>
</head>
<body>
    <div id="terminal-log"></div>

    <script>
    (() => {
      'use strict';

      const KEY_LOCAL_STATE = 'ls_local_state';
      const logContainer = document.getElementById('terminal-log');
      const queue = [];
      let processing = false;
      let cursorX = 0, cursorY = 0, latestState = null, activeMatrixContainer = null;
      let isAnimatingLocalTurn = false;
      let selectedOrigin = null;

      const DIRS = [ { dx: 0, dy: 1 }, { dx: 1, dy: 0 }, { dx: 0, dy: -1 }, { dx: -1, dy: 0 } ]; 
      const ROTATION_TABLE = { 
        KING: { 0: '◈', 1: '◈', 2: '◈', 3: '◈' }, 
        LASER: { 0: '⫝', 1: '⟜', 2: 'Ͳ', 3: 'Ð' }, 
        SWITCH: { 0: '⟋', 1: '⟍', 2: '⟋', 3: '⟍' }, 
        DEFENDER: { 0: '⬓', 1: '◧', 2: '⬒', 3: '◨' }, 
        DEFLECTOR: { 0: '◤', 1: '◥', 2: '◢', 3: '◣' } 
      };
      const BLUE_RESERVED = [{x: 9, y: 0}, {x: 9, y: 1}, {x: 9, y: 2}, {x: 9, y: 3}, {x: 9, y: 4}, {x: 9, y: 5}, {x: 9, y: 6}, {x: 9, y: 7}, {x: 1, y: 0}, {x: 1, y: 7}];
      const RED_RESERVED = [{x: 0, y: 0}, {x: 0, y: 1}, {x: 0, y: 2}, {x: 0, y: 3}, {x: 0, y: 4}, {x: 0, y: 5}, {x: 0, y: 6}, {x: 0, y: 7}, {x: 8, y: 0}, {x: 8, y: 7}];

      const INTERACTION_MAP = {
          DEFLECTOR: {
              0: { 0: { action: 'reflect', nextDir: 1 }, 3: { action: 'reflect', nextDir: 2 }, 1: { action: 'destroy' }, 2: { action: 'destroy' } },
              1: { 0: { action: 'reflect', nextDir: 3 }, 1: { action: 'reflect', nextDir: 2 }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              2: { 2: { action: 'reflect', nextDir: 3 }, 1: { action: 'reflect', nextDir: 0 }, 0: { action: 'destroy' }, 3: { action: 'destroy' } },
              3: { 2: { action: 'reflect', nextDir: 1 }, 3: { action: 'reflect', nextDir: 0 }, 0: { action: 'destroy' }, 1: { action: 'destroy' } }
          },
          SWITCH: {
              0: { 0: { action: 'reflect', nextDir: 1 }, 1: { action: 'reflect', nextDir: 0 }, 2: { action: 'reflect', nextDir: 3 }, 3: { action: 'reflect', nextDir: 2 } },
              1: { 0: { action: 'reflect', nextDir: 3 }, 3: { action: 'reflect', nextDir: 0 }, 2: { action: 'reflect', nextDir: 1 }, 1: { action: 'reflect', nextDir: 2 } },
              2: { 0: { action: 'reflect', nextDir: 1 }, 1: { action: 'reflect', nextDir: 0 }, 2: { action: 'reflect', nextDir: 3 }, 3: { action: 'reflect', nextDir: 2 } },
              3: { 0: { action: 'reflect', nextDir: 3 }, 3: { action: 'reflect', nextDir: 0 }, 2: { action: 'reflect', nextDir: 1 }, 1: { action: 'reflect', nextDir: 2 } }
          },
          DEFENDER: {
              0: { 0: { action: 'block' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              1: { 1: { action: 'block' }, 0: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              2: { 2: { action: 'block' }, 0: { action: 'destroy' }, 1: { action: 'destroy' }, 3: { action: 'destroy' } },
              3: { 3: { action: 'block' }, 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' } }
          },
          KING: {
              0: { 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              1: { 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              2: { 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } },
              3: { 0: { action: 'destroy' }, 1: { action: 'destroy' }, 2: { action: 'destroy' }, 3: { action: 'destroy' } }
          },
          LASER: {
              0: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } },
              1: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } },
              2: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } },
              3: { 0: { action: 'block' }, 1: { action: 'block' }, 2: { action: 'block' }, 3: { action: 'block' } }
          }
      };

      function scrollToBottom() { window.scrollTo(0, document.body.scrollHeight); }
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      function createLine(cls='') { const d = document.createElement('div'); d.className = `history-line ${cls}`; logContainer.appendChild(d); scrollToBottom(); return d; }
      function add(text, cls='') { if (processing) { type(text, cls, true); return; } queue.push({text,cls}); if (!processing) run(); }
      function addHTML(html, cls='') { const l = createLine(cls); l.innerHTML = html; }
      async function run() { processing = true; while(queue.length) { const i = queue.shift(); await type(i.text, i.cls); } processing = false; }
      async function type(text, cls, immediate=false) { const l = createLine(cls); if (immediate) { l.textContent = text; return l; } for (const c of text) { l.textContent += c; await sleep(10); } return l; }

      function getPieceChar(piece) { 
          const rot = piece.rotation || 0;
          return ROTATION_TABLE[piece.pieceType] ? ROTATION_TABLE[piece.pieceType][rot] : '?'; 
      }

      function getBoardPieces(state) { const src = state.board || state; return Array.isArray(src.pieces) ? src.pieces : (src.pieces ? Object.values(src.pieces) : []); }
      function getReservedClass(x, y) {
        if (BLUE_RESERVED.some(s => s.x === x && s.y === y)) return 'reserved-blue';
        if (RED_RESERVED.some(s => s.x === x && s.y === y)) return 'reserved-red';
        return null;
      }

      function inBounds(x, y) { return x >= 0 && x <= 9 && y >= 0 && y <= 7; }
      function normalizeRotation(rot) { return ((Number(rot) || 0) % 4 + 4) % 4; }
      function isReservedSquare(x, y, color) { return color === 'BLUE' ? RED_RESERVED.some(s => s.x === x && s.y === y) : BLUE_RESERVED.some(s => s.x === x && s.y === y); }
      function getPieceAt(pieces, x, y) { return pieces.find(p => p && p.x === x && p.y === y) || null; }
      
      function interactWithLaser(piece, incomingDir) {
          const typeMap = INTERACTION_MAP[piece.pieceType];
          if (!typeMap) return { kind: 'stop', destroyed: false };
          const outcome = typeMap[normalizeRotation(piece.rotation)]?.[incomingDir];
          if (!outcome) return { kind: 'stop', destroyed: false };
          if (outcome.action === 'reflect') return { kind: 'reflect', destroyed: false, reflected: outcome.nextDir };
          if (outcome.action === 'block') return { kind: 'stop', blocked: true, destroyed: false };
          if (outcome.action === 'destroy') return { kind: 'stop', destroyed: true };
          return { kind: 'stop', destroyed: false };
      }

      function resolveLaserVector(x, y, dir, pieces, path = [], seen = new Set()) {
          if (!inBounds(x, y)) return { path, hit: null, looped: false };
          const stateKey = `${x},${y},${dir}`;
          if (seen.has(stateKey)) return { path, hit: null, looped: true };
          seen.add(stateKey);
          path.push({ x, y, dir });

          const piece = getPieceAt(pieces, x, y);
          if (!piece) return resolveLaserVector(x + DIRS[dir].dx, y + DIRS[dir].dy, dir, pieces, path, seen);

          const outcome = interactWithLaser(piece, dir);
          if (outcome.kind === 'reflect') {
              const nextDir = outcome.reflected;
              return resolveLaserVector(x + DIRS[nextDir].dx, y + DIRS[nextDir].dy, nextDir, pieces, path, seen);
          }
          return { path, hit: { piece, blocked: !!outcome.blocked, destroyed: !!outcome.destroyed }, looped: false };
      }

      async function playLaserAnimation(state, pieces, shooterColor, victimPiece = null) {
          isAnimatingLocalTurn = true;
          const animPieces = [...pieces];
          if (victimPiece && !animPieces.some(p => p.x === victimPiece.x && p.y === victimPiece.y)) {
              animPieces.push(victimPiece);
          }
          const animState = { ...state, board: { ...state.board, pieces: animPieces } };
          
          const shooter = animPieces.find(p => p && p.pieceType === 'LASER' && p.color === shooterColor);
          if (shooter) {
              const startDir = normalizeRotation(shooter.rotation);
              const trace = resolveLaserVector(shooter.x + DIRS[startDir].dx, shooter.y + DIRS[startDir].dy, startDir, animPieces);
              printTerminalMatrix(animState, [], false);
              await sleep(500);
              printTerminalMatrix(animState, trace.path, false);
              await sleep(1500);
          }
          isAnimatingLocalTurn = false;
      }

      function startLocalGame() {
          const saved = localStorage.getItem(KEY_LOCAL_STATE);
          if (saved) {
              try {
                  latestState = JSON.parse(saved);
                  add("Resuming Local Game from storage.", "success-msg");
              } catch (e) { add("Failed to load saved game. Starting fresh.", "error-msg"); localStorage.removeItem(KEY_LOCAL_STATE); }
          }
          
          if (!latestState) {
            latestState = {
                board: {
                    turn: "RED",
                    phase: "MOVE",
                    moveNumber: 1,
                    pieces: [
                        {id: "pmpfnkxpm1", pieceType: "KING", color: "BLUE", rotation: 0, x: 4, y: 0},
                        {id: "pmpfnl4j03", pieceType: "KING", color: "RED", rotation: 0, x: 5, y: 7},
                        {id: "pmpfqugdq4", pieceType: "DEFENDER", color: "RED", rotation: 0, x: 4, y: 7},
                        {id: "pmpfquhvx5", pieceType: "DEFENDER", color: "RED", rotation: 2, x: 6, y: 7},
                        {id: "pmpfqunnp6", pieceType: "DEFENDER", color: "BLUE", rotation: 2, x: 5, y: 0},
                        {id: "pmpfquoqi7", pieceType: "DEFENDER", color: "BLUE", rotation: 2, x: 3, y: 0},
                        {id: "pmpfqvc388", pieceType: "SWITCH", color: "BLUE", rotation: 0, x: 5, y: 3},
                        {id: "pmpfqvfrb9", pieceType: "SWITCH", color: "BLUE", rotation: 1, x: 4, y: 3},
                        {id: "pmpfqvl06a", pieceType: "SWITCH", color: "RED", rotation: 0, x: 4, y: 4},
                        {id: "pmpfqvre4b", pieceType: "SWITCH", color: "RED", rotation: 1, x: 5, y: 4},
                        {id: "pmpfqwdqec", pieceType: "LASER", color: "RED", rotation: 2, x: 0, y: 7},
                        {id: "pmpfqy5dve", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 2, y: 0},
                        {id: "pmpfqya0pf", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 2, y: 3},
                        {id: "pmpfqyd1rg", pieceType: "DEFLECTOR", color: "BLUE", rotation: 1, x: 2, y: 4},
                        {id: "pmpfqz0jlj", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 0, y: 3},
                        {id: "pmpfqz7fpk", pieceType: "DEFLECTOR", color: "RED", rotation: 3, x: 0, y: 4},
                        {id: "pmpfqzj2ul", pieceType: "DEFLECTOR", color: "BLUE", rotation: 3, x: 7, y: 1},
                        {id: "pmpfr0e5km", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 6, y: 2},
                        {id: "pmpfr0t7zn", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 7, y: 4},
                        {id: "pmpfr0ww1o", pieceType: "DEFLECTOR", color: "RED", rotation: 3, x: 7, y: 3},
                        {id: "pmpfr18esp", pieceType: "DEFLECTOR", color: "BLUE", rotation: 1, x: 9, y: 3},
                        {id: "pmpfr1bjtq", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 9, y: 4},
                        {id: "pmpfr2ek5s", pieceType: "DEFLECTOR", color: "BLUE", rotation: 2, x: 3, y: 5},
                        {id: "pmpfr2sl8u", pieceType: "DEFLECTOR", color: "RED", rotation: 1, x: 2, y: 6},
                        {id: "pmpfr337lv", pieceType: "DEFLECTOR", color: "RED", rotation: 0, x: 7, y: 7},
                        {id: "pmpfr69imw", pieceType: "LASER", color: "BLUE", rotation: 0, x: 9, y: 0}
                    ]
                }
            };
          }
          printTerminalMatrix(latestState);
          add("Local Mode Initialized.", "success-msg");
      }

      function printTerminalMatrix(state, laserPath = [], replace = true) {
        latestState = state;
        const pieces = getBoardPieces(state);
        const grid = Array.from({ length: 8 }, () => Array(10).fill(null));
        for (const piece of pieces) { if (piece && Number.isFinite(piece.x)) grid[piece.y][piece.x] = piece; }
        
        const container = document.createElement('div'); container.className = 'matrix-container';

        const currentTurn = state.board?.turn || state.turn || 'RED';

        const statusBar = document.createElement('div');
        statusBar.className = 'history-line';
        statusBar.style.marginBottom = '12px';
        statusBar.style.fontSize = '20px';
        statusBar.style.borderBottom = '1px dashed var(--line)';
        statusBar.style.paddingBottom = '6px';
        statusBar.innerHTML = `[<span class="highlight">TURN</span>: <span class="p-${currentTurn.toLowerCase()}">${currentTurn}</span>]`;
        container.appendChild(statusBar);

        const instrHeader = document.createElement('div');
        instrHeader.innerHTML = `<div style="font-size: 15px; border: 1px solid var(--line); padding: 10px; margin-bottom: 12px; background: var(--bg0); color: var(--text); font-family: monospace; line-height: 1.4;">
<b style="color: var(--bright);">🏆 OBJECTIVE:</b> Eliminate the enemy <b>KING</b> by guiding your laser into it while protecting your own.<br>
<b style="color: var(--bright);">🕹️ ACTIONS:</b> Perform 1 per turn: <b>Move</b> (1 sq any direction) | <b>Rotate</b> (90° via R/L) | <b>Fire Laser</b> (Auto-fires at end, or skip move to manually fire via F).<br>
<b style="color: var(--bright);">🎮 CONTROLS:</b> Arrow keys to move cursor, enter to select piece/target, L to rotate counter clock wise and R to rotate clockwise. Q to Restart/Resign.<br>
<b style="color: var(--bright);">🧭 VECTORS:</b> 0: +Y (Up) | 1: +X (Right) | 2: -Y (Down) | 3: -X (Left)<br>
<b style="color: var(--bright);">♟️ PIECES:</b><br>
- <b>KING</b> (◈): Moves 1 sq. Cannot rotate. Vulnerable from all sides (Game Over).<br>
- <b>LASER</b> (⫝ ⟜ Ͳ Ð): Immobilized. Blocks all sides safely; fires beam.<br>
- <b>SWITCH</b> (⟋ ⟍): Moves 1 sq. Swaps with Deflectors/Defenders. Reflects 90° (Immune).<br>
- <b>DEFENDER</b> (⬓ ◧ ⬒ ◨): Moves 1 sq. Front blocks lasers; other 3 sides fatal. The solid (colored) side is the armored front. Can only block a head on hit on that side.<br>
- <b>DEFLECTOR</b> (◤ ◥ ◢ ◣): Moves 1 sq. Diagonal reflects 90°; other sides fatal.<br>
<b style="color: var(--bright);">⚠️ RULES:</b> No opponent home row entry | Blue Laser faces 0/3; Red faces 1/2 | No overlap unless SWITCH swapping.
</div>`;
        container.appendChild(instrHeader);

        for (let y = 7; y >= 0; y--) {
          let rowEl = document.createElement('div'); rowEl.className = 'matrix-row';
          for (let x = 0; x < 10; x++) {
            let cellEl = document.createElement('span'); cellEl.className = 'matrix-cell';
            
            const resClass = getReservedClass(x, y);
            if (resClass) cellEl.classList.add(resClass);
            if (x === cursorX && y === cursorY) cellEl.classList.add('cursor');
            if (selectedOrigin && x === selectedOrigin.x && y === selectedOrigin.y) cellEl.classList.add('selected-piece');

            cellEl.addEventListener('click', (e) => { e.preventDefault(); if (isAnimatingLocalTurn) return; cursorX = x; cursorY = y; printTerminalMatrix(latestState); handleGridAction(); });
            const p = grid[y][x]; 
            if (p) { 
              cellEl.textContent = getPieceChar(p); 
              cellEl.classList.add(p.color === 'RED' ? 'p-red' : 'p-blue'); 
            } else {
              const pathSegment = laserPath.find(seg => seg.x === x && seg.y === y);
              if (pathSegment) {
                const syms = ['^', '>', 'v', '<'];
                cellEl.textContent = syms[pathSegment.dir];
                cellEl.style.color = 'var(--laser)';
              } else {
                cellEl.textContent = '·'; 
              }
            }
            rowEl.appendChild(cellEl);
          }
          container.appendChild(rowEl);
        }
        
        if (state.status && state.status.endsWith('_WIN')) {
            const winner = state.status.split('_')[0];
            const div = document.createElement('div');
            div.className = 'success-msg';
            div.style.marginTop = '10px';
            div.textContent = `GAME OVER: ${winner} WINS!`;
            container.appendChild(div);
        }
        
        if (replace && activeMatrixContainer && activeMatrixContainer.parentNode) activeMatrixContainer.parentNode.replaceChild(container, activeMatrixContainer); 
        else logContainer.appendChild(container); 
        
        if (replace) activeMatrixContainer = container; 
        scrollToBottom();
      }

      window.addEventListener('keydown', (e) => {
        if (isAnimatingLocalTurn) return;
        if (e.key.toLowerCase() === 'q') { processGameAction({ action: 'Resign' }); return; }

        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key) || 
            ['r', 'l', 'f', 'q'].includes(e.key.toLowerCase())) {
            e.preventDefault();
        } else {
            return;
        }
        if (e.key === 'ArrowUp' && cursorY < 7) cursorY++;
        else if (e.key === 'ArrowDown' && cursorY > 0) cursorY--;
        else if (e.key === 'ArrowLeft' && cursorX > 0) cursorX--;
        else if (e.key === 'ArrowRight' && cursorX < 9) cursorX++;
        else if (e.key === 'Enter') handleGridAction();
        else if (e.key.toLowerCase() === 'r') rotatePiece(1);
        else if (e.key.toLowerCase() === 'l') rotatePiece(-1);
        else if (e.key.toLowerCase() === 'f') skipTurnAndFire();
        
        if (latestState) printTerminalMatrix(latestState);
      });

      async function processGameAction(intent) {
        if (!latestState) return;
        
        const currentTurn = latestState.board?.turn || latestState.turn || 'RED';
        const activePlayer = currentTurn; // In local mode, the active player is always whoever's turn it currently is.
        
        if (intent.action === 'Resign') {
            const winner = currentTurn === 'RED' ? 'BLUE' : 'RED';
            latestState.status = `${winner}_WIN`;
            add(`${currentTurn} RESIGNED. ${winner} WINS.`, "success-msg");
            localStorage.removeItem(KEY_LOCAL_STATE);
            printTerminalMatrix(latestState);
            add("Game data cleared. Refresh page to start a new match.", "system-msg");
            return;
        }

        if (latestState.status && latestState.status.endsWith('_WIN')) return; // Ignore actions if game over

        try {
            if (intent.action !== 'Turn End' && intent.action !== 'Manual Fire' && intent.piece) {
                const piecesDryRun = getBoardPieces(latestState);
                const dbPiece = getPieceAt(piecesDryRun, intent.piece.x, intent.piece.y);
                
                if (!dbPiece) throw new Error("Selection configuration anomaly: No piece occupies chosen origin.");
                if (dbPiece.color !== activePlayer) throw new Error(`Color ownership violation: Piece belongs to ${dbPiece.color}, but it is ${activePlayer}'s turn.`);
                if (dbPiece.pieceType !== intent.piece.type) throw new Error("State discrepancy: Local component entity mismatch.");
                
                if (intent.action === 'Move') {
                    const nx = intent.changes.new.x; const ny = intent.changes.new.y; const dx = Math.abs(nx - dbPiece.x); const dy = Math.abs(ny - dbPiece.y);
                    if (dx > 1 || dy > 1 || (dx === 0 && dy === 0)) throw new Error("Invalid move: Relocation offset bounds exceeded.");
                    if (dbPiece.pieceType === 'LASER') throw new Error("Invalid move: Sphinx (LASER) structural column immobilized.");
                    if (isReservedSquare(nx, ny, dbPiece.color)) throw new Error("Invalid move: Restricted landing zone column conflict.");
                    const pieceAtTarget = getPieceAt(piecesDryRun, nx, ny);
                    if (pieceAtTarget) {
                        if (dbPiece.pieceType === 'SWITCH' && (pieceAtTarget.pieceType === 'DEFLECTOR' || pieceAtTarget.pieceType === 'DEFENDER')) {
                            if (isReservedSquare(dbPiece.x, dbPiece.y, pieceAtTarget.color)) throw new Error("Invalid move: Trapped swap rule violation on target zone.");
                        } else { throw new Error("Invalid move: Destructive spatial overlap. Target square occupied."); }
                    }
                } else if (intent.action === 'Rotate') {
                    const newRot = intent.changes.new.rotation;
                    if (dbPiece.pieceType === 'KING') throw new Error("Invalid rotate: Pharaoh (KING) directional system locked.");
                    if (dbPiece.pieceType === 'LASER') {
                        if (dbPiece.color === 'BLUE' && (newRot === 1 || newRot === 2)) throw new Error("Invalid rotate: Blue Sphinx sector limits restricted to 0 or 3.");
                        if (dbPiece.color === 'RED' && (newRot === 3 || newRot === 0)) throw new Error("Invalid rotate: Red Sphinx sector limits restricted to 1 or 2.");
                    }
                }
            }
        } catch (localErr) { add(`Action Rejected: ${localErr.message}`, 'error-msg'); selectedOrigin = null; printTerminalMatrix(latestState); return; }
        
        const initialStateBackup = JSON.parse(JSON.stringify(latestState));
        isAnimatingLocalTurn = true; 
        try {
            const stateCopy = JSON.parse(JSON.stringify(latestState)); let pieces = getBoardPieces(stateCopy);
            if (intent.action !== 'Turn End' && intent.action !== 'Manual Fire' && intent.piece) {
                const dbPiece = getPieceAt(pieces, intent.piece.x, intent.piece.y);
                if (intent.action === 'Move') {
                    const nx = intent.changes.new.x; const ny = intent.changes.new.y; const pieceAtTarget = getPieceAt(pieces, nx, ny);
                    if (pieceAtTarget && dbPiece.pieceType === 'SWITCH') { pieceAtTarget.x = dbPiece.x; pieceAtTarget.y = dbPiece.y; }
                    dbPiece.x = nx; dbPiece.y = ny; add(`MOVE METADATA: (${intent.piece.x},${intent.piece.y}) -> (${nx},${ny})`, 'success-msg');
                } else if (intent.action === 'Rotate') {
                    dbPiece.rotation = intent.changes.new.rotation; add(`ROTATION METADATA: ${dbPiece.pieceType} modified to position ${dbPiece.rotation}`, 'success-msg');
                }
                if (stateCopy.board) stateCopy.board.pieces = pieces; else stateCopy.pieces = pieces;
                activeMatrixContainer = null; printTerminalMatrix(stateCopy); await sleep(500);
            }
            const shooter = pieces.find(p => p && p.pieceType === 'LASER' && p.color === activePlayer);
            if (shooter) {
                const startDir = normalizeRotation(shooter.rotation);
                const trace = resolveLaserVector(shooter.x + DIRS[startDir].dx, shooter.y + DIRS[startDir].dy, startDir, pieces);
                const victim = (trace.hit && trace.hit.destroyed) ? trace.hit.piece : null;
                await playLaserAnimation(stateCopy, pieces, activePlayer, victim);
                if (victim) {
                    pieces = pieces.filter(p => !(p.x === victim.x && p.y === victim.y));
                    if (stateCopy.board) stateCopy.board.pieces = pieces; else stateCopy.pieces = pieces;
                    add(`Laser beam eliminated ${victim.color} ${victim.pieceType} at coordinate (${victim.x}, ${victim.y}).`, "error-msg");
                    if (victim.pieceType === 'KING') { 
                        const winnerColor = victim.color === 'RED' ? 'BLUE' : 'RED';
                        stateCopy.status = `${winnerColor}_WIN`; 
                        add(`CRITICAL ALERT: ${victim.color} KING DESTROYED. ${winnerColor} ACHIEVES VICTORY.`, "success-msg"); 
                    }
                    activeMatrixContainer = null; printTerminalMatrix(stateCopy); await sleep(500);
                }
            }
            
            const nextTurn = currentTurn === 'RED' ? 'BLUE' : 'RED';
            if (stateCopy.board) { stateCopy.board.turn = nextTurn; stateCopy.board.moveNumber = (stateCopy.board.moveNumber || 0) + 1; }
            else { stateCopy.turn = nextTurn; stateCopy.moveNumber = (stateCopy.moveNumber || 0) + 1; }
            latestState = stateCopy;
            
            if (!latestState.status || !latestState.status.endsWith('_WIN')) {
                localStorage.setItem(KEY_LOCAL_STATE, JSON.stringify(latestState));
            } else {
                localStorage.removeItem(KEY_LOCAL_STATE);
            }

        } catch (err) { add(`Engine Mutation Failure: ${err.message}`, 'error-msg'); latestState = initialStateBackup; } finally { 
            activeMatrixContainer = null; 
            isAnimatingLocalTurn = false; 
            printTerminalMatrix(latestState); 
        }
        selectedOrigin = null;
      }

      async function skipTurnAndFire() { if (!latestState) return; add("Initiating direct fire / skipping move phase...", "system-msg"); await processGameAction({ action: 'Turn End' }); }
      
      function rotatePiece(dir) {
        if (!selectedOrigin || !latestState) return;
        const pieces = getBoardPieces(latestState); const p = pieces.find(p => p.x === selectedOrigin.x && p.y === selectedOrigin.y);
        if (p) { const nextRotation = ((p.rotation || 0) + dir + 4) % 4; processGameAction({ action: 'Rotate', piece: { x: selectedOrigin.x, y: selectedOrigin.y, type: p.pieceType }, changes: { new: { rotation: nextRotation } } }); }
      }

      async function handleGridAction() {
        if (!latestState || isAnimatingLocalTurn) return;
        if (!selectedOrigin) {
            const pieces = getBoardPieces(latestState); const p = pieces.find(p => p.x === cursorX && p.y === cursorY);
            if (p) { selectedOrigin = { x: cursorX, y: cursorY }; add(`Selected: ${cursorX},${cursorY}`, 'system-msg'); } else { add(`No piece at ${cursorX},${cursorY}`, 'error-msg'); }
            printTerminalMatrix(latestState);
        } else {
            const pieces = getBoardPieces(latestState); const movingPiece = pieces.find(p => p.x === selectedOrigin.x && p.y === selectedOrigin.y);
            if (selectedOrigin.x === cursorX && selectedOrigin.y === cursorY) { selectedOrigin = null; add(`Deselected`, 'system-msg'); printTerminalMatrix(latestState); }
            else { await processGameAction({ action: 'Move', piece: { x: selectedOrigin.x, y: selectedOrigin.y, type: movingPiece ? movingPiece.pieceType : null }, changes: { new: { x: cursorX, y: cursorY } } }); }
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        add('====================================================', 'system-msg');
        add('LASER CHESS - Local Offline Edition', 'system-msg');
        add('====================================================', 'system-msg');
        startLocalGame();
      });

    })();
    </script>
